[project]
name = "bsra-locomotion-training"
version = "0.1.0"
description = "Humanoid locomotion simulation, training, and evaluation for BSRA"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium[mujoco]==1.2.3",
    "mujoco==3.6.0",
    "stable-baselines3==2.7.1",
    "torch==2.10.0",
    "tensorboard==2.21.0",
    "numpy==2.4.2",
]

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.uv]
package = false
# Matches the platforms targeted by the existing BSRA RL onboarding repo.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
